[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-v2"
version = "0.1.0"
description = "Минимальное ядро IRIS v2"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "PySide6>=6.7,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
iris-v2 = "iris_v2.cli:main"
iris-v2-gui = "iris_v2.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iris_v2 = ["data/*.json", "migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
